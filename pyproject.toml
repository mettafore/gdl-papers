[project]
name = "gdl-papers"
version = "0.1.0"
description = "PyTorch reproductions of geometric deep learning papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.2.2",
    "numpy<2",
    "scikit-learn>=1.4,<1.6",
    "torch-geometric>=2.8.0",
    "pandas>=2.3.3",
    "matplotlib>=3.11.1",
]

[dependency-groups]
dev = [
    "modal>=1.5.2",
    "mypy>=2.2.0",
    "pytest>=8.0",
    "ruff>=0.15.22",
]

[tool.ruff]
# Notebooks are scratch space — not linted (matches the AGENTS.md commit rule).
extend-exclude = ["*.ipynb"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Defaults (E4/E7/E9 + F) plus import sorting.
extend-select = ["I"]

[tool.pytest.ini_options]
markers = [
    "needs_data: needs a real dataset download (QM9 etc.) — deselected in CI with -m 'not needs_data'",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdl"]

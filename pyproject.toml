[project]
name = "gdl-papers"
version = "0.1.0"
description = "PyTorch reproductions of geometric deep learning papers"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.14.0",
    "numpy<2",
    "scikit-learn>=1.4,<1.6",
    "torch-geometric>=2.8.0",
    "pandas>=2.3.3",
    "matplotlib>=3.11.1",
    "torchdiffeq>=0.2.5",
    "seaborn>=0.13.2",
    "plotly>=6.9.0",
    "e3nn>=0.6.0",
    "nbformat>=5.11.1",
    "ase>=3.29.0",
]

[dependency-groups]
dev = [
    "modal>=1.5.2",
    "mypy>=2.2.0",
    "pytest>=8.0",
    "ruff>=0.15.22",
]

[tool.ruff]
# Ignore untracked data folders when classifying first-party imports.
src = ["src"]
# Notebooks are scratch space — not linted (matches the AGENTS.md commit rule).
# Fetched author source is preserved verbatim, not formatted as project code.
extend-exclude = ["*.ipynb", "papers/*/sources/**"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Defaults (E4/E7/E9 + F) plus import sorting, bugbear (likely bugs), pyupgrade
# (modern 3.12 syntax), simplify, and NumPy-specific checks.
extend-select = ["I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.flake8-bugbear]
# Stateless modules / frozen dataclasses are safe as default arguments.
extend-immutable-calls = ["torch.nn.SiLU", "model.MACEConfig", "train.TrainConfig"]

[tool.pytest.ini_options]
# Dataset-backed tests are opt-in: run them with `pytest -m needs_data`.
addopts = "-m 'not needs_data'"
markers = [
    "needs_data: needs a real dataset download (QM9 etc.) — deselected in CI with -m 'not needs_data'",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdl"]

[project]
name = "gdl-papers"
version = "0.1.0"
description = "PyTorch reproductions of geometric deep learning papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.2.2",
    "numpy<2",
    "scikit-learn>=1.4,<1.6",
    "torch-geometric>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdl"]

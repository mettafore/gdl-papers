<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Cormorant";font-weight:300;font-style:normal;src:url(fonts/cormorant-garamond-latin-300-normal.woff2)}
@font-face{font-family:"Cormorant";font-weight:400;font-style:italic;src:url(fonts/cormorant-garamond-latin-400-italic.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Intro theme: point cloud -> molecular graph -> flow on S^2 -> spherical
// harmonics -> symmetry mandala -> title. Every frame is a pure function of t.
const Q = new URLSearchParams(location.search);
const SHOW_TITLE = Q.get('title') !== '0';
const NAME = Q.get('name') || 'LUV SUNEJA';
const TAG = Q.get('tag') || 'GEOMETRY  ·  SYMMETRY  ·  INTELLIGENCE';
const W = 1920, H = 1080, DUR = 16.5;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const b1 = mk(W / 4, H / 4), b1x = b1.getContext('2d');
const b2 = mk(W / 8, H / 8), b2x = b2.getContext('2d');

// ---------- utils ----------
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261115);
const gauss = () => { let u = 0, v = 0; while (u === 0) u = R(); v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185 * v); };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const smooth = x => x * x * (3 - 2 * x);
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -9 * x);
const lerp = (a, b, e) => a + (b - a) * e;
const TAU = Math.PI * 2;

// ---------- sprites ----------
const COL = [[150, 185, 255], [240, 200, 130], [255, 250, 240]]; // cool, gold, white
function sprite(c) {
  const s = mk(64, 64), x = s.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  const m = `${c[0]},${c[1]},${c[2]}`;
  g.addColorStop(0, `rgba(255,255,255,1)`); g.addColorStop(.12, `rgba(${m},.95)`);
  g.addColorStop(.35, `rgba(${m},.32)`); g.addColorStop(1, `rgba(${m},0)`);
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return s;
}
const SPR = COL.map(sprite);
const rgba = (i, a) => `rgba(${COL[i][0]},${COL[i][1]},${COL[i][2]},${a})`;

// ---------- particle states ----------
const N = 9000;
const A = () => new Float32Array(N * 3);
const cloud = A(), mol = A(), sU = A(), sD = A(), man = A(), swirl = A();
const delay = new Float32Array(N), phase = new Float32Array(N), size = new Float32Array(N);
const cBase = new Uint8Array(N), cMol = new Uint8Array(N), cMan = new Uint8Array(N);

for (let i = 0; i < N; i++) {
  const r = 1.9 * Math.cbrt(R()) * (0.6 + 0.4 * R());
  let x = gauss(), y = gauss(), z = gauss(); const l = Math.hypot(x, y, z);
  cloud[3 * i] = x / l * r * 1.5; cloud[3 * i + 1] = y / l * r * 0.85; cloud[3 * i + 2] = z / l * r * 1.2;
  swirl[3 * i] = gauss() * .22; swirl[3 * i + 1] = gauss() * .22; swirl[3 * i + 2] = gauss() * .22;
  delay[i] = R(); phase[i] = R() * TAU; size[i] = 0.55 + Math.pow(R(), 3) * 1.6;
  const c = R(); cBase[i] = c < .64 ? 0 : c < .93 ? 1 : 2;
}

// --- molecule: two aromatic rings joined by an O-CH2 linker (3BPA-like) ---
const atoms = [], bonds = [];
(function buildMol() {
  const add = (p, type) => atoms.push({ p, type }) - 1;        // type 0 C, 1 N/O, 2 H
  const b = 0.52;
  function ring(cx, cy, cz, tilt, hetero) {
    const ids = [];
    for (let k = 0; k < 6; k++) {
      const a = k * TAU / 6, x = Math.cos(a) * b, y = Math.sin(a) * b;
      ids.push(add([cx + x, cy + y * Math.cos(tilt), cz + y * Math.sin(tilt)], k === hetero ? 1 : 0));
    }
    for (let k = 0; k < 6; k++) bonds.push([ids[k], ids[(k + 1) % 6]]);
    return ids;
  }
  const out = (id, cx, cy, cz, len, type) => {
    const p = atoms[id].p, d = [p[0] - cx, p[1] - cy, p[2] - cz], l = Math.hypot(...d);
    const n = add([p[0] + d[0] / l * len, p[1] + d[1] / l * len, p[2] + d[2] / l * len], type); bonds.push([id, n]); return n;
  };
  const ra = ring(-1.28, -0.1, 0, 0.25, -1), rb = ring(1.28, 0.1, 0, -0.75, 2);
  const c7 = add([-0.42, 0.22, 0.12], 0), o8 = add([0.1, -0.12, -0.1], 1);
  bonds.push([ra[0], c7], [c7, o8], [o8, rb[3]]);
  for (const k of [1, 2, 3, 4, 5]) out(ra[k], -1.28, -0.1, 0, 0.36, 2);
  for (const k of [0, 5, 4]) out(rb[k], 1.28, 0.1, 0, 0.36, 2);
  out(rb[1], 1.28, 0.1, 0, 0.5, 1);                           // amine N
  add([-0.5, 0.58, 0.32], 2); bonds.push([c7, atoms.length - 1]);
  add([-0.4, 0.05, 0.5], 2); bonds.push([c7, atoms.length - 1]);
  // BFS depth from the linker oxygen for message-passing pulses
  const adj = atoms.map(() => []); bonds.forEach(([a, c]) => { adj[a].push(c); adj[c].push(a); });
  atoms.forEach(a => a.depth = -1); atoms[o8].depth = 0; const q = [o8];
  while (q.length) { const u = q.shift(); for (const v of adj[u]) if (atoms[v].depth < 0) { atoms[v].depth = atoms[u].depth + 1; q.push(v); } }
  bonds.forEach(bd => { if (atoms[bd[0]].depth > atoms[bd[1]].depth) bd.reverse(); });
})();
(function fillMol() {
  const w = atoms.map(a => a.type === 2 ? .35 : 1), tot = w.reduce((s, x) => s + x, 0);
  for (let i = 0; i < N; i++) {
    let x, y, z;
    if (R() < 0.68) {
      let u = R() * tot, k = 0; while (u > w[k]) u -= w[k++];
      const a = atoms[k], s = a.type === 2 ? .04 : .075;
      x = a.p[0] + gauss() * s; y = a.p[1] + gauss() * s; z = a.p[2] + gauss() * s;
      cMol[i] = a.type === 1 ? 1 : a.type === 2 ? 0 : (R() < .25 ? 2 : 0);
    } else {
      const bd = bonds[Math.floor(R() * bonds.length)], p = atoms[bd[0]].p, q = atoms[bd[1]].p, e = R();
      x = lerp(p[0], q[0], e) + gauss() * .012; y = lerp(p[1], q[1], e) + gauss() * .012; z = lerp(p[2], q[2], e) + gauss() * .012;
      cMol[i] = 0;
    }
    mol[3 * i] = x; mol[3 * i + 1] = y; mol[3 * i + 2] = z;
  }
})();

// --- sphere: uniform base, flowing to a clustered "data" distribution ---
(function fillSphere() {
  const K = 11, cen = [];
  for (let k = 0; k < K; k++) {
    let x = gauss(), y = gauss() * .6, z = gauss(); const l = Math.hypot(x, y, z);
    cen.push({ c: [x / l, y / l, z / l], s1: .05 + R() * .16, s2: .03 + R() * .07, a: R() * TAU, w: .4 + R() });
  }
  const ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), th = ga * i;
    const u = [Math.cos(th) * r, y, Math.sin(th) * r];
    sU[3 * i] = u[0]; sU[3 * i + 1] = u[1]; sU[3 * i + 2] = u[2];
    let best = 0, bs = -1e9;                                    // nearby cluster, softly randomised
    for (let k = 0; k < K; k++) { const c = cen[k].c, s = (u[0] * c[0] + u[1] * c[1] + u[2] * c[2]) * 3.2 + Math.log(cen[k].w) - Math.log(-Math.log(R() + 1e-9)); if (s > bs) { bs = s; best = k; } }
    const C = cen[best], c = C.c;
    let t1 = [-c[2], 0, c[0]]; let l1 = Math.hypot(...t1) || 1; t1 = t1.map(v => v / l1);
    const t2 = [c[1] * t1[2] - c[2] * t1[1], c[2] * t1[0] - c[0] * t1[2], c[0] * t1[1] - c[1] * t1[0]];
    const g1 = gauss() * C.s1, g2 = gauss() * C.s2, ca = Math.cos(C.a), sa = Math.sin(C.a);
    const e1 = g1 * ca - g2 * sa, e2 = g1 * sa + g2 * ca;
    const d = [c[0] + t1[0] * e1 + t2[0] * e2, c[1] + t1[1] * e1 + t2[1] * e2, c[2] + t1[2] * e1 + t2[2] * e2], l = Math.hypot(...d);
    sD[3 * i] = d[0] / l; sD[3 * i + 1] = d[1] / l; sD[3 * i + 2] = d[2] / l;
  }
})();

// --- mandala: thirteen circles and every line between their centres (D6) ---
const mCirc = [], mLines = [];
(function buildMandala() {
  const r0 = 0.3, cs = [[0, 0]];
  for (let k = 0; k < 6; k++) { const a = k * TAU / 6 + TAU / 12; cs.push([2 * r0 * Math.cos(a), 2 * r0 * Math.sin(a)]); }
  for (let k = 0; k < 6; k++) { const a = k * TAU / 6 + TAU / 12; cs.push([4 * r0 * Math.cos(a), 4 * r0 * Math.sin(a)]); }
  cs.forEach(c => mCirc.push({ x: c[0], y: c[1], r: r0, a: .5 }));
  mCirc.push({ x: 0, y: 0, r: 1.5, a: .6 }, { x: 0, y: 0, r: 1.56, a: .3 });
  for (let i = 0; i < 13; i++) for (let j = i + 1; j < 13; j++) mLines.push([cs[i], cs[j]]);
  const items = [];
  mCirc.forEach(c => items.push({ w: TAU * c.r, f: () => { const a = R() * TAU; return [c.x + c.r * Math.cos(a), c.y + c.r * Math.sin(a)]; } }));
  mLines.forEach(([p, q]) => items.push({ w: Math.hypot(q[0] - p[0], q[1] - p[1]) * .3, f: () => { const e = R(); return [lerp(p[0], q[0], e), lerp(p[1], q[1], e)]; } }));
  items.push({ w: 3.2, f: () => { const k = Math.floor(R() * 72), a = k * TAU / 72; return [1.68 * Math.cos(a), 1.68 * Math.sin(a)]; }, dot: 1 });
  items.push({ w: 1.2, f: () => [gauss() * .02, gauss() * .02], dot: 1 });
  const tot = items.reduce((s, x) => s + x.w, 0);
  for (let i = 0; i < N; i++) {
    let u = R() * tot, k = 0; while (u > items[k].w) u -= items[k++].w;
    const p = items[k].f(), j = items[k].dot ? .012 : .005;
    man[3 * i] = p[0] + gauss() * j; man[3 * i + 1] = p[1] + gauss() * j; man[3 * i + 2] = gauss() * .004;
    cMan[i] = R() < .78 ? 1 : (R() < .5 ? 2 : 0);
  }
})();

// --- background dust ---
const ND = 1500, dust = new Float32Array(ND * 4);
for (let i = 0; i < ND; i++) { const r = 3 + R() * 7, a = R() * TAU, y = (R() - .5) * 9; dust[4 * i] = Math.cos(a) * r; dust[4 * i + 1] = y; dust[4 * i + 2] = Math.sin(a) * r; dust[4 * i + 3] = R(); }

// real spherical harmonics (polar axis = y), scaled to unit peak
const Y20 = (x, y, z) => (3 * y * y - 1) / 2;
const Y32 = (x, y, z) => 2.598 * y * (x * x - z * z);

// ---------- timeline ----------
const T = { burst: .75, mol: [2.1, 3.0], sph: [5.1, 6.0], flow: [6.2, 8.1], harm: [8.2, 9.0], harm2: [9.6, 10.3], man: [10.8, 12.0], hit: 12.0, emb: [12.6, 13.6] };
const CAM = 6, F = 1500;

function frame(t) {
  // camera / object frame
  const yaw = 0.42 * t + 0.4, pit = 0.3 + 0.06 * Math.sin(t * .5);
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pit), sp = Math.sin(pit);
  const rot = (x, y, z, o) => { const X = x * cy + z * sy, Z = -x * sy + z * cy; o[0] = X; o[1] = y * cp - Z * sp; o[2] = y * sp + Z * cp; };
  const zoom = 1 + 0.05 * Math.sin(t * .37) + 0.06 * smooth(ramp(t, 0, 12));
  const fade = smooth(ramp(t, 0.05, 0.6)) * (1 - smooth(ramp(t, 15.5, 16.4)));
  const emb = ease(ramp(t, T.emb[0], T.emb[1]));
  const mScale = lerp(1, 0.5, emb), mOff = lerp(0, 0.52, emb), roll = 0.05 * (t - T.hit);
  const cr = Math.cos(roll), sr = Math.sin(roll);

  // background
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none';
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 1100);
  bg.addColorStop(0, '#0b0e1c'); bg.addColorStop(.55, '#06070f'); bg.addColorStop(1, '#020205');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const P = (x, y, z, o) => { const s = F * zoom / (CAM - z); o[0] = W / 2 + x * s; o[1] = H / 2 - y * s; o[2] = s / F; };
  // (0.1667 = 250px per unit at z=0 with F/CAM = 250)

  // --- dust ---
  const dA = smooth(ramp(t, .8, 3)) * lerp(1, .55, emb);
  const dy = Math.cos(.04 * t), dsn = Math.sin(.04 * t), o3 = [0, 0, 0], o2 = [0, 0, 0];
  for (let i = 0; i < ND; i++) {
    const x = dust[4 * i] * dy + dust[4 * i + 2] * dsn, z = -dust[4 * i] * dsn + dust[4 * i + 2] * dy - 4;
    P(x, dust[4 * i + 1], z, o2); const s = 3 + 9 * dust[4 * i + 3] * dust[4 * i + 3];
    ctx.globalAlpha = dA * (.05 + .16 * (1 - dust[4 * i + 3])) * (.7 + .3 * Math.sin(t * 1.3 + i));
    ctx.drawImage(SPR[i % 5 === 0 ? 1 : 0], o2[0] - s, o2[1] - s, 2 * s, 2 * s);
  }

  // --- stage weights ---
  const gM = ramp(t, ...T.mol), gS = ramp(t, ...T.sph), gF = ramp(t, ...T.flow), gH = ramp(t, ...T.harm), gH2 = ease(ramp(t, ...T.harm2)), gN = ramp(t, ...T.man);
  const expand = outExpo(ramp(t, T.burst, T.burst + 1.7));
  const wMol = smooth(ramp(t, 2.7, 3.05)) * (1 - smooth(ramp(t, 5.1, 5.5)));
  const wSph = smooth(ramp(t, 5.7, 6.1)) * (1 - smooth(ramp(t, 8.2, 8.8)));
  const wMan = ramp(t, 11.2, 12.15);
  const RS = 1.45;

  // --- sphere graticule (behind particles) ---
  if (wSph > 0) {
    ctx.lineWidth = 1;
    const seg = (pts) => { for (let k = 0; k < pts.length - 1; k++) { const a = pts[k], b = pts[k + 1]; ctx.globalAlpha = wSph * (a[3] > 0 ? .34 : .09); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); } };
    ctx.strokeStyle = rgba(0, 1);
    for (let la = -80; la <= 80; la += 20) { const pts = []; const y = Math.sin(la * Math.PI / 180), r = Math.cos(la * Math.PI / 180); for (let k = 0; k <= 72; k++) { const a = k * TAU / 72; rot(r * Math.cos(a) * RS, y * RS, r * Math.sin(a) * RS, o3); P(o3[0], o3[1], o3[2], o2); pts.push([o2[0], o2[1], 0, o3[2]]); } seg(pts); }
    for (let lo = 0; lo < 360; lo += 20) { const pts = []; const a = lo * Math.PI / 180; for (let k = 0; k <= 36; k++) { const b = -Math.PI / 2 + k * Math.PI / 36; rot(Math.cos(b) * Math.cos(a) * RS, Math.sin(b) * RS, Math.cos(b) * Math.sin(a) * RS, o3); P(o3[0], o3[1], o3[2], o2); pts.push([o2[0], o2[1], 0, o3[2]]); } seg(pts); }
  }

  // --- particles ---
  const pos = [0, 0, 0], q = [0, 0, 0], prev = [0, 0, 0];
  const st = (u, d) => ease(clamp((u - d * .35) / .65));
  function sphereAt(i, e, o) {            // slerp along the geodesic from base to data
    const ax = sU[3 * i], ay = sU[3 * i + 1], az = sU[3 * i + 2], bx = sD[3 * i], by = sD[3 * i + 1], bz = sD[3 * i + 2];
    const om = Math.acos(clamp(ax * bx + ay * by + az * bz, -1, 1)), so = Math.sin(om);
    if (so < 1e-4) { o[0] = ax; o[1] = ay; o[2] = az; return; }
    const k0 = Math.sin((1 - e) * om) / so, k1 = Math.sin(e * om) / so;
    o[0] = ax * k0 + bx * k1; o[1] = ay * k0 + by * k1; o[2] = az * k0 + bz * k1;
  }
  const flowing = t > T.flow[0] && t < T.flow[1] + .1;
  ctx.lineWidth = 1.1;
  for (let i = 0; i < N; i++) {
    const d = delay[i], j = 3 * i; let x, y, z, col = cBase[i], sw = 0, bright = 1;
    const wob = .012, wx = Math.sin(t * 1.1 + phase[i]) * wob, wy = Math.cos(t * .9 + phase[i] * 1.7) * wob;
    if (t < T.mol[1]) {                                       // cloud -> molecule
      const e = st(gM, d), k = expand * (1 + .05 * Math.sin(t * .6 + phase[i]));
      x = lerp(cloud[j] * k, mol[j], e); y = lerp(cloud[j + 1] * k, mol[j + 1], e); z = lerp(cloud[j + 2] * k, mol[j + 2], e);
      sw = Math.sin(Math.PI * e); if (e > .5) col = cMol[i];
    } else if (t < T.sph[1]) {                                // molecule -> sphere
      const e = st(gS, d);
      x = lerp(mol[j], sU[j] * RS, e); y = lerp(mol[j + 1], sU[j + 1] * RS, e); z = lerp(mol[j + 2], sU[j + 2] * RS, e);
      sw = Math.sin(Math.PI * e); if (e < .5) col = cMol[i];
    } else if (t < T.harm[0]) {                               // geodesic flow
      const e = st(gF, d); sphereAt(i, e, q); x = q[0] * RS; y = q[1] * RS; z = q[2] * RS;
      if (flowing && i % 3 === 0) { const e0 = st(gF - .014, d); if (e !== e0) { sphereAt(i, e0, prev); prev[0] *= RS; prev[1] *= RS; prev[2] *= RS; } else prev[0] = NaN; }
    } else if (t < T.man[0]) {                                // sphere -> harmonics
      const e = st(gH, d), ux = sU[j], uy = sU[j + 1], uz = sU[j + 2];
      const Y = lerp(Y20(ux, uy, uz), Y32(ux, uy, uz), gH2), r = .16 + 1.62 * Math.abs(Y);
      x = lerp(sD[j] * RS, ux * r, e); y = lerp(sD[j + 1] * RS, uy * r, e); z = lerp(sD[j + 2] * RS, uz * r, e);
      sw = Math.sin(Math.PI * e) * .6; if (e > .5) col = Y > 0 ? (i % 7 === 0 ? 2 : 1) : 0;
    } else {                                                  // harmonics -> mandala (handled below)
      const ux = sU[j], uy = sU[j + 1], uz = sU[j + 2], Y = Y32(ux, uy, uz), r = .16 + 1.62 * Math.abs(Y);
      x = ux * r; y = uy * r; z = uz * r; col = Y > 0 ? (i % 7 === 0 ? 2 : 1) : 0;
    }
    rot(x + swirl[j] * sw + wx, y + swirl[j + 1] * sw + wy, z + swirl[j + 2] * sw, pos);
    if (t >= T.man[0]) {
      const e = st(gN, d), s2 = Math.sin(Math.PI * e) * .8;
      const mx = (man[j] * cr - man[j + 1] * sr) * mScale, my = (man[j] * sr + man[j + 1] * cr) * mScale + mOff;
      pos[0] = lerp(pos[0], mx, e) + swirl[j] * s2; pos[1] = lerp(pos[1], my, e) + swirl[j + 1] * s2; pos[2] = lerp(pos[2], man[j + 2], e) + swirl[j + 2] * s2;
      if (e > .5) col = cMan[i];
      bright = lerp(1, .62 + .38 * Math.sin(t * 2.2 + phase[i] * 3), e) * lerp(1, .8, emb);
    }
    P(pos[0], pos[1], pos[2], o2);
    const dof = Math.abs(pos[2]) * .55, s = (3.3 * size[i] * (1 + dof)) * o2[2] * 4.0 * lerp(1, .8, emb);
    let a = .8 / (1 + dof * dof * 2.2) * bright;
    if (t < T.burst + .4) a *= ramp(t, T.burst - .05, T.burst + .25);
    ctx.globalAlpha = Math.min(1, a);
    ctx.drawImage(SPR[col], o2[0] - s, o2[1] - s, 2 * s, 2 * s);
    if (flowing && i % 3 === 0 && t < T.harm[0] && !Number.isNaN(prev[0])) {
      rot(prev[0], prev[1], prev[2], q); const ox = o2[0], oy = o2[1]; P(q[0], q[1], q[2], o2);
      ctx.globalAlpha = .5 * (pos[2] > 0 ? 1 : .3); ctx.strokeStyle = rgba(1, 1);
      ctx.beginPath(); ctx.moveTo(o2[0], o2[1]); ctx.lineTo(ox, oy); ctx.stroke();
    }
  }

  // --- molecule: bonds, message-passing pulses, node flashes ---
  if (wMol > 0) {
    const sp = atoms.map(a => { rot(a.p[0], a.p[1], a.p[2], o3); P(o3[0], o3[1], o3[2], o2); return [o2[0], o2[1], o2[2]]; });
    ctx.lineWidth = 1.4; ctx.strokeStyle = rgba(0, 1);
    for (const [a, b] of bonds) { ctx.globalAlpha = wMol * .42; ctx.beginPath(); ctx.moveTo(sp[a][0], sp[a][1]); ctx.lineTo(sp[b][0], sp[b][1]); ctx.stroke(); }
    for (const t0 of [3.0, 3.75, 4.5]) {
      for (const [a, b] of bonds) {
        const u = (t - t0 - atoms[a].depth * .11) / .22;
        if (u > 0 && u < 1) { const e = smooth(u), x = lerp(sp[a][0], sp[b][0], e), y = lerp(sp[a][1], sp[b][1], e), s = 15; ctx.globalAlpha = wMol * Math.sin(Math.PI * u); ctx.drawImage(SPR[1], x - s, y - s, 2 * s, 2 * s); }
      }
      atoms.forEach((a, k) => {
        const u = (t - t0 - a.depth * .11) / .55;
        if (u > 0 && u < 1) { const s = (a.type === 2 ? 20 : 34) * (0.6 + u); ctx.globalAlpha = wMol * (1 - u) * .8; ctx.drawImage(SPR[a.type === 1 ? 1 : 2], sp[k][0] - s, sp[k][1] - s, 2 * s, 2 * s);
          ctx.globalAlpha = wMol * (1 - u) * .5; ctx.strokeStyle = rgba(1, 1); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(sp[k][0], sp[k][1], 10 + 46 * u, 0, TAU); ctx.stroke(); ctx.strokeStyle = rgba(0, 1); ctx.lineWidth = 1.4; }
      });
    }
  }

  // --- mandala linework ---
  if (wMan > 0) {
    const S = 250 * zoom * (CAM / CAM) * mScale, cx0 = W / 2, cy0 = H / 2 - mOff * 250 * zoom;
    const flash = 1 + 1.3 * Math.exp(-(Math.max(0, t - T.hit)) * 2.4) * (t >= T.hit ? 1 : 0);
    const tx = (x, y) => [cx0 + (x * cr - y * sr) * S, cy0 - (x * sr + y * cr) * S];
    ctx.strokeStyle = rgba(1, 1);
    mLines.forEach(([p, q2], k) => {
      const e = ease(clamp(wMan * 1.5 - (k % 13) / 26)); if (e <= 0) return;
      const a = tx(p[0], p[1]), b = tx(lerp(p[0], q2[0], e), lerp(p[1], q2[1], e));
      ctx.globalAlpha = Math.min(1, .13 * flash); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    });
    mCirc.forEach((c, k) => {
      const e = ease(clamp(wMan * 1.4 - (k % 7) / 18)); if (e <= 0) return; const p = tx(c.x, c.y);
      ctx.globalAlpha = Math.min(1, c.a * .75 * flash); ctx.lineWidth = c.r > 1 ? 1.5 : 1.2; ctx.beginPath(); if (e > .999) ctx.arc(p[0], p[1], c.r * S, 0, TAU); else ctx.arc(p[0], p[1], c.r * S, -Math.PI / 2 - roll, -Math.PI / 2 - roll + TAU * e); ctx.stroke();
    });
    if (t >= T.hit) {                                         // release ring on the downbeat
      const u = (t - T.hit) / 1.6; if (u < 1) { ctx.globalAlpha = (1 - u) * (1 - u) * .6; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx0, cy0, (1.56 + 3.4 * outExpo(u)) * 250, 0, TAU); ctx.stroke(); }
    }
  }

  // --- bindu + opening ring ---
  { const b = smooth(ramp(t, .1, .7)) * (1 - smooth(ramp(t, T.burst, T.burst + 1.1)));
    if (b > 0) { const s = 26 + 8 * Math.sin(t * 5) + 150 * ramp(t, T.burst, T.burst + .5); ctx.globalAlpha = b; ctx.drawImage(SPR[2], W / 2 - s, H / 2 - s, 2 * s, 2 * s); ctx.drawImage(SPR[1], W / 2 - s * 2.4, H / 2 - s * 2.4, 4.8 * s, 4.8 * s); }
    const u = (t - T.burst) / 1.5; if (u > 0 && u < 1) { ctx.globalAlpha = (1 - u) * (1 - u) * .7; ctx.strokeStyle = rgba(1, 1); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(W / 2, H / 2, 900 * outExpo(u), 0, TAU); ctx.stroke(); } }

  // --- captions (small, lower left) ---
  const caps = [[1.0, 2.3, 'x ∈ ℝ³'], [3.0, 5.2, 'f (R x) = R f (x)'], [6.2, 8.2, 'ẋ = v(x),   x ∈ S²'], [9.0, 10.8, 'Y ℓ m (θ, φ)'], [12.0, 12.9, 'D₆']];
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.font = 'italic 400 36px Cormorant'; ctx.fillStyle = rgba(2, 1);
  for (const [a, b, s] of caps) { const al = smooth(ramp(t, a, a + .5)) * (1 - smooth(ramp(t, b - .4, b))); if (al > 0) { ctx.globalAlpha = al * .72; ctx.fillText(s, 110, H - 100); ctx.globalAlpha = al * .6; ctx.fillStyle = rgba(1, 1); ctx.fillRect(110, H - 80, 56 * al, 1); ctx.fillStyle = rgba(2, 1); } }

  // --- title ---
  if (SHOW_TITLE) {
    const a = smooth(ramp(t, 13.0, 14.1)), a2 = smooth(ramp(t, 13.5, 14.5));
    if (a > 0) {
      ctx.textAlign = 'center';
      ctx.font = '300 92px Cormorant'; ctx.letterSpacing = `${lerp(46, 30, outExpo(ramp(t, 13.0, 15.5)))}px`;
      ctx.fillStyle = 'rgba(250,244,230,1)'; ctx.globalAlpha = a; ctx.fillText(NAME, W / 2 + 15, 778);
      const lw = 260 * ease(ramp(t, 13.3, 14.4)); ctx.fillStyle = rgba(1, 1); ctx.globalAlpha = .8 * a; ctx.fillRect(W / 2 - lw, 818, 2 * lw, 1);
      ctx.font = '300 19px Inter'; ctx.letterSpacing = '9px'; ctx.fillStyle = rgba(1, 1); ctx.globalAlpha = a2 * .9; ctx.fillText(TAG, W / 2 + 4, 866);
      ctx.letterSpacing = '0px';
    }
  }

  // --- bloom ---
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  b1x.globalCompositeOperation = 'copy'; b1x.filter = 'blur(5px)'; b1x.drawImage(cv, 0, 0, W / 4, H / 4);
  b2x.globalCompositeOperation = 'copy'; b2x.filter = 'blur(9px)'; b2x.drawImage(cv, 0, 0, W / 8, H / 8);
  ctx.globalCompositeOperation = 'lighter'; ctx.imageSmoothingQuality = 'high';
  ctx.globalAlpha = .5; ctx.drawImage(b1, 0, 0, W, H);
  ctx.globalAlpha = .42; ctx.drawImage(b2, 0, 0, W, H);

  // --- vignette + fade ---
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const vg = ctx.createRadialGradient(W / 2, H / 2, 420, W / 2, H / 2, 1150);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.72)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (fade < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fade})`; ctx.fillRect(0, 0, W, H); }
}
window.DUR = DUR;
window.renderFrame = frame;
window.ready = Promise.all([document.fonts.load('300 92px Cormorant'), document.fonts.load('italic 400 30px Cormorant'), document.fonts.load('300 19px Inter')]).then(() => true);
if (Q.get('play')) { const t0 = performance.now(); (function loop() { frame(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); }
</script></body></html>

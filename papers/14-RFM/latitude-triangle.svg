<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">Latitude on the unit sphere</title>
  <desc id="desc">A vertical cross-section of a sphere. The latitude angle phi is measured from the equatorial plane. The triangle has height z and hypotenuse r equals one.</desc>
  <rect width="520" height="360" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="16" fill="#242424">
    <circle cx="235" cy="175" r="125" fill="none" stroke="#b0b0b0"/>
    <path d="M235 30V310 M90 175H380" fill="none" stroke="#b0b0b0"/>
    <path d="M235 175L343.25 112.5L343.25 175Z" fill="#edf3fa"/>
    <path d="M235 175L343.25 112.5" fill="none" stroke="#326da8" stroke-width="3"/>
    <path d="M343.25 112.5V175" fill="none" stroke="#b15f2a" stroke-width="3"/>
    <path d="M235 175H343.25 M334.25 175V166H343.25 M265 175A30 30 0 0 0 260.98 160" fill="none" stroke="#242424"/>
    <circle cx="343.25" cy="112.5" r="4" fill="#326da8"/>
    <text x="279" y="169">φ</text>
    <text x="266" y="124">r = 1</text>
    <text x="357" y="150">z</text>
    <text x="335" y="93" text-anchor="end">Point (x, y, z)</text>
    <text x="221" y="196">O</text>
    <text x="249" y="37">z axis</text>
    <text x="235" y="337" text-anchor="middle">Equatorial plane: z = 0</text>
  </g>
</svg>

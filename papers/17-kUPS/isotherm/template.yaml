adsorbates:
  - !import ["adsorbate/co2.yaml"]

hosts:
  - cif_file: host/RUBTAK.cif
    pressure: PRESSURE_PA
    temperature: 298.15   # K
    init_adsorbates: [0]
    cell_replication: 3


lj: !import ["lennard_jones/trappe.yaml"]

ewald:
  real_cutoff: 12.0
  precision: 1.e-6

run:
  out_file: OUT_FILE
  num_cycles: 10_000
  num_warmup_cycles: 1_000
  min_cycle_length: 20
  seed: 42

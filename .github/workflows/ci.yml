name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the full history

      - name: No tracked file over 1 MB
        run: |
          git ls-files -z | xargs -0 stat -c '%s %n' \
            | awk '$1 > 1000000 { print "  " $0; bad = 1 } END { exit bad }'

      - name: gitleaks (secret scan)
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks
          ./gitleaks git --redact --no-banner -v .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: ruff format --check
        run: uv run ruff format --check src/ papers/

      - name: ruff check
        run: uv run ruff check src/ papers/

      - name: mypy
        run: |
          uv run mypy src/gdl
          for dir in papers/*/; do
            if [ -d "${dir}src" ]; then
              uv run mypy "${dir}src"
            fi
          done

      - name: Run tests (per paper — module names collide across papers)
        run: |
          set -e
          for dir in papers/*/; do
            if ls "$dir"test_*.py >/dev/null 2>&1; then
              echo "=== pytest $dir ==="
              uv run pytest "$dir" -q -m "not needs_data"
            fi
          done

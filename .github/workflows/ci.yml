name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: ruff format --check
        run: uv run ruff format --check src/ papers/

      - name: ruff check
        run: uv run ruff check src/ papers/

      - name: Run tests (per paper — module names collide across papers)
        run: |
          set -e
          for dir in papers/*/; do
            if ls "$dir"test_*.py >/dev/null 2>&1; then
              echo "=== pytest $dir ==="
              uv run pytest "$dir" -q -m "not needs_data"
            fi
          done
